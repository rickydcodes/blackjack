   <body>
      <div id="main">
         <div style="width: 100%; left: 0px; top: 0px;" class="title">Black Jack</div>
         <div id="sides">
            <div class="side">
               <div style="width: 300px; left: 0px; top: 0px; color: darkblue; font-size: 12px; font-weight: bold;" class="title">Player's Score: 0</div>
               <div id="playerCards"></div>
            </div>
            <div class="side">
               <div style="width: 300px; right: 0px; top: 0px; color: crimson; font-size: 12px; font-weight: bold;" class="title">Dealer's Score: 0</div>
               <div id="dealerCards"></div>
            </div>
         </div>
         <div id="buttons">
            <h2 id="moneyParagraph">$100.00</h2>
            <div id="btnHolder">
               <button class="btn" id="hitButton">Hit</button>
               <button class="btn" id="standButton">Stand</button>
               <button class="btn" id="dealButton">Deal</button>
               <div id="betDiv">
                 <input id="betInput" type="number" placeholder="Bet (Minimum $10)">
                 <button id="placeBetButton">Place bet</button>
               </div>
            </div>
         </div>
      </div>
